name: life_companion
description: "Your personal AI-powered life tracker and companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  # Networking (Ollama API)
  http: ^1.3.0
  # Date handling
  intl: ^0.19.0
  # UI
  flutter_markdown: ^0.7.6+2
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  # Location
  geolocator: ^14.0.0
  # Security
  pointycastle: ^3.9.1
  # Storage
  shared_preferences: ^2.3.5
  # Local LLM (on-device inference via llama.cpp)
  llamadart: ^0.6.8
  # Utils
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3

hooks:
  user_defines:
    llamadart:
      llamadart_native_backends:
        platforms:
          android-arm64:
            backends: [vulkan, cpu]
            cpu_profile: full

flutter:
  uses-material-design: true
